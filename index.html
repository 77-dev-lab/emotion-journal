<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><title>反思筆記</title>

<style>

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dp{background:var(--cd);border-radius:16px;text-align:center;padding:8px 0;cursor:pointer;line-height:1.3}.dp span{font-size:var(--f-xs);color:var(--mu);display:block}.dp b{font-size:var(--f-ttl);display:block}.dp i{font-style:normal;font-size:var(--f-xs);color:var(--gr);display:block;min-height:14px}.dp.on{background:var(--pr);color:var(--pt)}.dp.on span,.dp.on i{color:var(--pt)}.dp.td b{text-decoration:underline}
.empty{text-align:center;color:var(--mu);padding:30px 0}.mis{background:var(--in);border-radius:12px;padding:10px;font-size:var(--f-md);margin:8px 0}

.qb{border-radius:14px;padding:10px;min-height:120px}.bw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px 0}

.ov{width:100%;border-collapse:collapse}.ov td{padding:3px 4px;font-size:var(--f-xs)}.ov td.k{font-size:var(--f-sm);white-space:nowrap}
.bc{display:flex;gap:4px;align-items:flex-end;overflow-x:auto;padding:4px 0;min-height:110px}.bcol{flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}.bb{width:100%;border-radius:6px 6px 2px 2px}.bv{font-size:var(--f-xs)}.bl{font-size:var(--f-xs);color:var(--mu)}
.rate{font:600 var(--f-big)/1.1 var(--serif)}
#nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--cd);border-radius:24px 24px 0 0;box-shadow:0 -8px 24px -12px rgba(58,44,38,.25);padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 8px);max-width:560px;margin:auto;z-index:9}
.nh{display:flex;justify-content:space-around}#nav .nh button{background:none;color:var(--mu);min-height:44px;padding:6px 8px;margin:0;font-size:var(--f-md)}#nav .nh button.on{color:var(--tx);font-weight:700}
#fab{width:56px;height:56px;border-radius:50%;font-size:28px;padding:0;margin:-30px 10px 0;box-shadow:0 8px 20px -6px rgba(58,44,38,.5);background:var(--gr);color:#fff}
input[type=file]{font-size:var(--f-md);padding:6px 8px}input[type=file]::file-selector-button{font:inherit;font-size:var(--f-md);border:0;border-radius:999px;padding:4px 12px;margin-right:10px;background:var(--pr);color:var(--pt);cursor:pointer}
</style></head><body>
<header><div><div class="sub" id="dt"></div><h1>反思筆記</h1></div><span id="st" class="sub"></span></header>
<div id="app"></div>
<nav id="nav"><div class="nh"><button data-a="tab" data-t="r">記錄</button><button data-a="tab" data-t="w">週回顧</button></div><button id="fab" data-a="fab" aria-label="新增情緒事件">＋</button><div class="nh"><button data-a="tab" data-t="o">總覽</button><button data-a="tab" data-t="d">資料庫</button></div></nav>
<script>
const BASE=["成就感","開心","滿足","期待","感激","平靜","焦慮","逃避","疲憊","挫折","難過","遺憾","內疚","自責","羨慕","尷尬","困惑","無力","不甘","孤單"];
const CAT={"黃區":["成就感","開心","期待"],"綠區":["滿足","感激","平靜"],"紅區":["焦慮","挫折","不甘"],"藍區":["難過","遺憾","孤單","無力","疲憊"]},ZC={"黃區":"#d9a21b","綠區":"#4f9a6b","紅區":"#c0524a","藍區":"#4a79b8"};
let MISSION=["以長期主義出發，勇敢行動，","對生活永保好奇心與創造力；","以真誠與富足的心，主動關心、樂於付出，","領導自己，鼓舞他人，創造無限可能"];
let KEYS=["長期主義","勇敢行動","好奇心與創造力","真誠與富足","主動關心、樂於付出","領導自己","鼓舞他人","創造無限可能"];
const DM=[...MISSION],DK=[...KEYS];
const WORDS={"黃區":[["開心","期待","有信心","好奇","感興趣"],["興奮","成就感","驕傲","熱情","振奮"]],"綠區":[["平靜","滿足","放鬆","感激","安心"],["自在","踏實","心滿意足","被療癒","安詳"]],"紅區":[["煩躁","緊張","不耐煩","挫折","擔心"],["憤怒","焦慮","恐慌","不甘","不公平感"]],"藍區":[["失望","疲憊","遺憾","低落","無奈"],["難過","孤單","無力","被忽視","空虛"]]};
const DESC={"黃區":"高能量・愉悅","綠區":"低能量・愉悅","紅區":"高能量・不愉悅","藍區":"低能量・不愉悅"},PL=[["很不愉悅",-2],["不愉悅",-1],["愉悅",1],["很愉悅",2]],EL=[["能量很低",-2],["偏低",-1],["偏高",1],["能量很高",2]];
const zoneOf=(n,z)=>z||Object.keys(WORDS).find(k=>WORDS[k].flat().includes(n))||Object.keys(CAT).find(k=>CAT[k].includes(n))||"";
const zd=c=>ZC[c]?`<i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${ZC[c]};margin-right:4px"></i>`:"",dot=(n,z)=>zd(zoneOf(n,z));
const zc=e=>{const q=[...e.emos].sort((a,b)=>b.v-a.v)[0];return q?ZC[zoneOf(q.n,q.z)]:""};
const ICE='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 2.5 8.5 10h7z"/><path d="M2 10.5h20" stroke-dasharray="2 2"/><path d="M5 12l3 8.5h8L19 12z"/></svg>';
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function wk(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=d.getUTCFullYear();return y+"-W"+String(Math.ceil(((d-Date.UTC(y,0,1))/864e5+1)/7)).padStart(2,"0")}
const cw=wk(new Date()),inW=t=>t&&wk(new Date(t))==cw,ft=t=>{const d=new Date(t);return(d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const nid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5),K=x=>x.id.split("_")[0],mid=()=>"m_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),SV=3;
let db=null,uid=null,smp=null,D={ev:[],ice:[],ins:[],wk:[],cfg:[]},tab="r",sub="ev",flt="open",ox=new Set(),pend="",capv="",UI={},tm={},wo=0,day="";
const it=id=>[...D.ev,...D.ice,...D.ins,...D.wk,...D.cfg].find(x=>x.id==id),col=()=>db.collection("data/users/"+uid);
async function put(x){try{if(db)await col().doc(x.id).set(x);else localStorage.setItem("v2:"+x.id,JSON.stringify(x));$("#st").textContent=db?"已儲存":"已存本機";return true}catch(e){$("#st").textContent="儲存失敗";return false}}
function sv(x){x.v=SV;x.ut=Date.now();clearTimeout(tm[x.id]);$("#st").textContent="儲存中…";tm[x.id]=setTimeout(()=>put(x),400)}
async function rm(x){const a=D[K(x)];a.splice(a.indexOf(x),1);try{if(db)await col().doc(x.id).delete();else localStorage.removeItem("v2:"+x.id)}catch(e){}}
async function init(){$("#dt").textContent=new Date().toLocaleDateString("zh-TW",{month:"long",day:"numeric",weekday:"long"});draw();try{const c=window.claude;if(c){db=await c.use("db");const u=await c.use("user");uid=db&&u?await u.id():null;if(!uid)db=null;smp=await c.use("sample")}}catch(e){db=null}
 let r=[];try{if(db)r=(await col().get()).docs.map(d=>d.data());else r=Object.keys(localStorage).filter(k=>k.startsWith("v2:")).map(k=>JSON.parse(localStorage.getItem(k)))}catch(e){}
 r.forEach(x=>{if(x&&x.id&&D[K(x)])D[K(x)].push(x)});Object.values(D).forEach(a=>a.sort((a,b)=>b.t-a.t));migrate();draw()}
let IX={};const bx=()=>{IX={};D.ev.forEach(e=>e.emos.forEach(q=>{IX[q.id]={e,n:q.n,z:q.z,q}}))},tagInfo=k=>IX[k]||null,vt=x=>x.tags.filter(tagInfo);
function applyCfg(){const c=D.cfg[0];if(c){if(typeof c.mission=="string")MISSION=c.mission.split("\n");if(Array.isArray(c.keys))KEYS=c.keys.slice()}else{MISSION=[...DM];KEYS=[...DK]}}
const gcfg=()=>{let c=D.cfg[0];if(!c){c={id:"cfg_main",t:Date.now(),mission:MISSION.join("\n"),keys:[...KEYS]};D.cfg.push(c)}return c};
function renameKey(o,n){D.wk.forEach(w=>{let c=0;(w.mission||[]).forEach(r=>{if(r.key==o){r.key=n;c=1}});if(w.focus==o){w.focus=n;c=1}if(c)sv(w)});D.ev.forEach(e=>{if(e.mk==o){e.mk=n;sv(e)}})}
const untag=i=>[...D.ice,...D.ins].forEach(y=>{if(y.tags.includes(i)){y.tags=y.tags.filter(k=>k!=i);sv(y)}});
function migrate(){const ch=new Set(),old={};
 D.ev.forEach(e=>{if(!Array.isArray(e.emos))e.emos=[];e.emos.forEach(q=>{if(!q.id){q.id=mid();ch.add(e)}const k=e.id+"|"+q.n;if(!old[k])old[k]=q.id})});
 [...D.ice,...D.ins].forEach(x=>{const t=(x.tags||[]).map(k=>k.includes("|")?old[k]:k).filter(Boolean);if(!x.tags||t.length!=x.tags.length||t.some((k,i)=>k!=x.tags[i]))ch.add(x);x.tags=t;if(K(x)=="ins"&&!Array.isArray(x.counters))x.counters=[]});
 D.wk.forEach(w=>{if("done" in w){if(w.rocksDone==null)w.rocksDone=w.done;delete w.done;ch.add(w)}if(!Array.isArray(w.mission)||!w.mission.length)w.mission=[{key:"",ev:""}]});
 const gone=[];D.wk.forEach(w=>{const n=w.id.replace(/-W(\d)$/,"-W0$1");if(n!=w.id&&!D.wk.some(o=>o.id==n)){gone.push([w.id,w]);w.id=n;ch.add(w)}});
 gone.forEach(([i,w])=>put(w).then(ok=>ok&&(db?col().doc(i).delete():localStorage.removeItem("v2:"+i))).catch(()=>{}));
 [...D.ev,...D.ice,...D.ins].forEach(x=>{if(x.done&&x.doneAt&&!x.firstDoneAt){x.firstDoneAt=x.doneAt;ch.add(x)}});
 [...D.ev,...D.ice,...D.ins,...D.wk,...D.cfg].forEach(x=>{if(x.v!==SV)ch.add(x)});ch.forEach(sv);bx();applyCfg();return ch.size}
const miss=x=>K(x)=="ev"?[["事件文字",x.text],["情緒詞",x.emos.length?"1":""]].filter(a=>!(a[1]||"").trim()).map(a=>a[0]):K(x)=="ice"?[["名稱",x.name],["觀點",x.view],["期待",x.expect],["渴望",x.desire]].filter(a=>!(a[1]||"").trim()).map(a=>a[0]).concat(vt(x).length?[]:["關聯情緒"]):[["名稱",x.name],["Trigger",x.trigger]].filter(a=>!(a[1]||"").trim()).map(a=>a[0]).concat(x.counters.some(c=>(c.text||"").trim())?[]:["對策"]);
function upd(x){const b=document.querySelector(`[data-ok="${x.id}"]`);if(b){const m=miss(x);b.disabled=!!m.length;b.nextElementSibling.textContent=m.length?"尚需："+m.join("、"):""}}
const opts=(a,v)=>a.map(x=>`<option ${x==v?"selected":""}>${esc(x)}</option>`).join(""),kopts=v=>opts(v&&!KEYS.includes(v)?[...KEYS,v]:KEYS,v);
const fit=el=>{el.style.height="auto";el.style.height=el.scrollHeight+"px"};
const chips=()=>`<div class="row">${[["open","進行中"],["done","已完成"],["all","全部"]].map(([k,l])=>`<button class="b ${flt==k?"on":""}" data-a="flt" data-k="${k}">${l}</button>`).join("")}</div>`;
function dash(){const dn=a=>a.filter(x=>x.done),card=(k,l,n,s)=>`<div class="dc d-${k} ${sub==k?"on":""}" data-a="sub" data-k="${k}"><b>${n}</b>${l}<div class="lab">${s}</div></div>`;
 return `<div class="dash">${card("ev","情緒事件",D.ev.length,`收下 ${dn(D.ev).length}・本週 +${D.ev.filter(x=>inW(x.t)).length}`)}${card("ins","洞察",dn(D.ins).length,`進行 ${D.ins.length-dn(D.ins).length}・本週 +${D.ins.filter(x=>inW(x.firstDoneAt)).length}`)}${card("ice","冰山",dn(D.ice).length,`進行 ${D.ice.length-dn(D.ice).length}・本週 +${D.ice.filter(x=>inW(x.firstDoneAt)).length}`)}</div>`}
const tagChips=x=>`<div class="bt">${vt(x).map(k=>{const i=tagInfo(k);return `<span class="tg" data-a="rmtag" data-id="${x.id}" data-k="${esc(k)}">${dot(i.n,i.z)}${esc(i.n)} ×</span>`}).join("")}</div>`+(()=>{const o=D.ev.slice(0,30).flatMap(e=>e.emos.map(m=>({k:m.id,l:m.n+"・"+(e.text||"").slice(0,10)}))).filter(o=>!x.tags.includes(o.k));return o.length?`<select data-f="addtag" data-id="${x.id}"><option value="">＋ 關聯情緒…</option>${o.map(o=>`<option value="${esc(o.k)}">${esc(o.l)}</option>`).join("")}</select>`:""})();
const delB=x=>`<button class="x" data-a="del" data-id="${x.id}">${pend==x.id?"再按一次確認":"刪除"}</button>`;
